services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: taim-portfolio-dev
    restart: always 
    ports:
      - "3010:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
    stdin_open: true
    tty: true

