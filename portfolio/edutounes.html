---

**💻 EduTounes — Plongée dans l'architecture d'une app de prise de notes augmentée par l'IA**

Je développe actuellement **EduTounes**, une application open-source de prise de notes avec génération automatique de flashcards, quiz, podcasts, et chat contextuel — le tout 100% local ou via vos propres clés API.

Voici les décisions architecturales qui structurent le projet :

---

**🧱 Stack**

React 18 + TypeScript — Tailwind CSS v4 — Vite — Tauri (desktop natif Rust) / Electron (fallback). Le typage strict TypeScript couvre l'intégralité du modèle de domaine (Note, Block, Flashcard, Quiz, Podcast, Job, Folder).

\`\`\`
src/
├── App.tsx              # Routage global + Suspense + FloatingPomodoro
├── components/          # 17 composants UI (Editor, Flashcards, Quiz, Pomodoro…)
├── pages/               # Dashboard, NoteView, Settings, Onboarding
├── lib/
│   ├── app.tsx          # Contexte global (Repo, Engine, Prefs)
│   ├── theme.ts         # Moteur de thème (4 palettes, GSAP overlay)
│   ├── types.ts         # Modèle de domaine (Note, Block, Flashcard, Quiz…)
│   ├── history.ts       # Pile undo/redo (snapshot-based, profondeur 50)
│   ├── markdown.ts      # Parseur markdown ↔ blocks (round-trip)
│   ├── engine/          # 7 fournisseurs IA, router, resilient
│   ├── db/              # IndexedDB + Memory fallback
│   ├── generation/      # Pipelines IA (notes, flashcards, quiz, podcast)
│   └── study/           # FSRS-5, suivi de maîtrise
└── styles/
    └── theme.css        # ~2000 lignes de design system
\`\`\`

**🗄️ Persistance 3 couches**

- **IndexedDB** via une couche \`Repo\` abstraite (CRUD pour notes, blocs, flashcards, quiz, podcasts)
- **localStorage** : préférences utilisateur, thème (4 palettes), profils Pomodoro, clés API chiffrées
- **Memory fallback** : si IndexedDB est indisponible, un \`Map\` en mémoire prend le relais — jamais de perte de données

\`\`\`typescript
// app.tsx — initialisation
const repo = await idbStore().catch(() => memoryStore());
// Le fallback est silencieux et transparent pour l'utilisateur
\`\`\`

Chaque modification de préférence ou de palette est instantanément propagée via \`BroadcastChannel\` :

\`\`\`typescript
const bc = new BroadcastChannel("edutounes-prefs");
bc.onmessage = () => reloadEngine();
\`\`\`

Les composants réagissent aux événements DOM customs :
- \`edutounes:palette-change\` → mise à jour des couleurs
- \`edutounes:folder-select\` → filtre des notes dans le Dashboard
- \`edutounes:pomodoro-toast\` → notification de fin de focus
- \`edutounes:sidebar-search\` → synchronisation de la recherche

---

**🎨 Moteur de thème maison**

Le système repose sur 2 attributs HTML + 1 attribut contextuel :
- \`data-theme\` → light | dark
- \`data-color-accent\` → cyan | multicolor | monochrome | custom
- \`data-current-view\` → colore la palette Multicolor par module

4 palettes complètes :
| Palette | Principe | Couleurs |
|---------|----------|----------|
| **Cyan** | Défaut pro — #06b6d4 partout | Teal monocorde |
| **Multicolor** | Ambre, Teal, Cyan, Émeraude selon la vue | Modulaire |
| **Monochrome** | Zinc greys — minimal radical | #18181b → #fafafa |
| **Custom** | Color picker + calcul auto des variants | HSL dynamique |

La transition entre palettes utilise GSAP avec un overlay flash :

\`\`\`typescript
function animatePaletteFlash(onVisualChange: () => void) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;z-index:9999;pointer-events:none;";
  document.body.appendChild(overlay);
  // Timeline : flash blanc → changement visuel → fade out
  gsap.timeline()
    .to(overlay, { backgroundColor: "rgba(255,255,255,0.06)", duration: 0.1 })
    .call(onVisualChange)
    .to(overlay, { backgroundColor: "rgba(255,255,255,0)", duration: 0.2 });
}
\`\`\`

---

**📝 Éditeur à blocs avec round-trip markdown**

Le contenu est modélisé en \`Block[]\` (13 types : heading, bullet, code, math KaTeX, table GFM, callout GitHub-style, todo, divider…). Un parseur bidirectionnel assure la conversion markdown ↔ blocks sans perte :

\`\`\`typescript
// Round-trip garanti
const blocks = markdownToBlocks(markdownSource);    // parse
const markdown = blocksToMarkdown(blocks);            // sérialise
\`\`\`

Sauvegarde automatique avec debounce 400ms :
\`\`\`typescript
function persist(patch: Partial<Note>) {
  const next = { ...note, ...patch, updatedAt: now() };
  historyRef.current.push(next);           // snapshot dans la pile undo
  setSaving(true);
  setTimeout(() => {
    repo?.putNote(next);                    // écriture IndexedDB
    setSaving(false);
  }, 400);
}
\`\`\`

La pile undo/redo \`History<T>\` stocke 50 snapshots via \`structuredClone\`.

---

**🧠 Moteur IA resilient**

Architecture qui supporte **7 fournisseurs** avec détection automatique :

\`\`\`typescript
// engine/router.ts
const engines = {
  openai, anthropic, groq, openrouter, perplexity, xai, deepseek, nvidia
};
\`\`\`

Chaque appel API est wrapped dans un système resilient avec retry exponentiel. Le mode local utilise Ollama + Whisper + Kokoro pour le TTS — zéro dépendance cloud.

Détection du provider par préfixe de clé API :
\`\`\`typescript
function detectProvider(key: string): Provider | null {
  if (key.startsWith("sk-ant")) return "anthropic";
  if (key.startsWith("gsk_")) return "groq";
  if (key.startsWith("sk-")) return "openai"; // ou deepseek — ambiguïté gérée
  // …
}
\`\`\`

**📐 Leçons apprises en chemin**

✅ **Ce qui marche bien :**
- Le système de variables CSS dynamiques est flexible et performant
- La virtualisation du Dashboard (\`@tanstack/react-virtual\`) gère 1000+ notes sans ralentissement
- Le parseur markdown couvre tous les cas (math KaTeX, tables, callouts, listes imbriquées)
- L'architecture du moteur IA resilient encaisse les erreurs API sans planter l'UI

⚠️ **Ce que je referais différemment :**
- **7 implémentations manuelles de dropdowns** (via \`createPortal\` + \`getBoundingClientRect\`) — une abstraction \`DropdownPortal\` commune est la priorité numéro 1
- Le composant **Pomodoro** (380 lignes, 8 \`useState\`, 8 \`useEffect\`) doit être éclaté en sous-composants
- \`structuredClone\` sur des notes de 200 blocs 50 fois de suite = lag potentiel. Passer à un diff-based approach
- La fonction utilitaire \`relTime()\` est dupliquée textuellement entre Dashboard et NoteView

---

**🎯 Prochaines étapes techniques :**
1. Abstraire les 7 dropdowns en un composant \`DropdownPortal\` réutilisable
2. Éclater le Pomodoro en sous-composants (Timer, SessionConfig, Stats)
3. Remplacer \`structuredClone\` par un système de patches optimisé
4. Ajouter des raccourcis clavier dans Flashcards (1-4 pour les ratings) et Quiz (A-D)

Content is modeled as \`Block[]\` (13 types: heading, bullet, code, KaTeX math, GFM table, GitHub-style callout, todo, divider…). A bidirectional parser ensures lossless markdown ↔ blocks conversion:

\`\`\`typescript
// Guaranteed round-trip
const blocks = markdownToBlocks(markdownSource);    // parse
const markdown = blocksToMarkdown(blocks);            // serialize
\`\`\`

Auto-save with 400ms debounce:
\`\`\`typescript
function persist(patch: Partial<Note>) {
  const next = { ...note, ...patch, updatedAt: now() };
  historyRef.current.push(next);           // snapshot into undo stack
  setSaving(true);
  setTimeout(() => {
    repo?.putNote(next);                    // IndexedDB write
    setSaving(false);
  }, 400);
}
\`\`\`

The \`History<T>\` undo/redo stack stores 50 snapshots via \`structuredClone\`.

---

**🧠 Resilient AI Engine**

Architecture supporting **7 providers** with auto-detection:

\`\`\`typescript
// engine/router.ts
const engines = {
  openai, anthropic, groq, openrouter, perplexity, xai, deepseek, nvidia
};
\`\`\`

Each API call is wrapped in a resilient system with exponential backoff retry. Local mode uses Ollama + Whisper + Kokoro for TTS — zero cloud dependency.

Provider detection by API key prefix:
\`\`\`typescript
function detectProvider(key: string): Provider | null {
  if (key.startsWith("sk-ant")) return "anthropic";
  if (key.startsWith("gsk_")) return "groq";
  if (key.startsWith("sk-")) return "openai"; // or deepseek — handled ambiguity
  // …
}
\`\`\`

---

**📐 Lessons learned along the way**

✅ **What works well:**
- The dynamic CSS variable system is flexible and performant
- Dashboard virtualization (\`@tanstack/react-virtual\`) handles 1000+ notes smoothly
- The markdown parser covers all edge cases (KaTeX math, tables, callouts, nested lists)
- The resilient AI engine architecture absorbs API errors without crashing the UI

⚠️ **What I'd do differently:**
- **7 manual dropdown implementations** (via \`createPortal\` + \`getBoundingClientRect\`) — a shared \`DropdownPortal\` abstraction is priority #1
- The **Pomodoro component** (380 lines, 8 \`useState\`, 8 \`useEffect\`) needs splitting into sub-components
- \`structuredClone\` on 200-block notes 50 times in a row = potential lag. Switch to a diff-based approach
- The \`relTime()\` utility is duplicated verbatim between Dashboard and NoteView

2. Split the Pomodoro into sub-components (Timer, SessionConfig, Stats)
3. Replace \`structuredClone\` with an optimized patch system

Chaque palette redéfinit **~30 variables CSS** (accents, surfaces, ombres, badges, glassmorphism). L'utilisateur peut basculer à tout moment et la transition est adoucie par un overlay GSAP.

\`\`\`

\`\`\`css

L'utilisateur choisit une couleur via \`<input type="color">\`. Le moteur calcule automatiquement les variants (\`darken()\`, \`lighten()\`), produit les swatches, le gradient, et les applique à toutes les surfaces.

## 📥 9 sources d'ingestion — toutes fonctionnelles

La V1 supportait blank, text, pdf, docx, audio, url, youtube. La V1.1 ajoute **deux nouveaux types** :

| Source | Statut | Technique |
|--------|--------|-----------|
| **Image (OCR)** | ✅ Nouveau | Tesseract.js — Web Worker + WASM, 100% navigateur, zéro clé API |
| **PPTX** | ✅ Nouveau | JSZip + regex \`<a:t>\`, extraction texte diapositives |

### OCR Image — \`src/lib/ingest/image.ts\`

\`\`\`typescript
// Worker lazy singleton — téléchargé UNE seule fois par session
let workerPromise: Promise<Tesseract.Worker> | null = null;

async function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      const Tesseract = await import("tesseract.js");
      return await Tesseract.createWorker("eng");
    })();

La V1.2 complète les databases inspirées de Notion/AppFlowy : **4 types de vues** sur les mêmes données, **8 types de champs** (dont relation & rollup), filtres, tris, et relation entre bases.

## 🔄 P2-A — Synchronisation multi-appareils (serveur self-hosted pur Node)

Le point le plus gros du chantier : un **serveur de sync self-hosted, zéro dépendance**, qui synchronise **11 collections** (notes, folders, flashcards, quiz, attempts, podcasts, chat, databases, db_rows, workspaces, comments) entre tous les appareils.

### Le serveur — \`server/sync.mjs\` + \`server/sync/\`

\`\`\`
[App Electron] ──→ /api/sync/* (monté sur le serveur local)
                    ├── register / login    → JWT HMAC-SHA256 (node:crypto)
                    ├── pull?since=…        → changements depuis le curseur
                    ├── push {changes}      → diffs locaux, LWW côté serveur
                    ├── share / shares      → registre note_shares (P2-B)
                    └── /api/sync/ws        → WebSocket RFC6455 minimal (temps réel)
\`\`\`

| Endpoint | Méthode | Usage |
|----------|---------|-------|
| \`/api/sync/register\` | POST | Création de compte (scrypt + JWT) |
| \`/api/sync/login\` | POST | Connexion |
| \`/api/sync/pull\` | GET | Changements depuis un curseur (\`since\`) |
| \`/api/sync/push\` | POST | Push des changements locaux |
| \`/api/sync/share\` | POST/DELETE/PATCH | Partager / révoquer / changer le rôle |
| \`/api/sync/shares\` | GET | Liste des partages d'une note |
| \`/api/sync/shared-notes\` | GET | Notes partagées avec moi |
| \`/api/sync/ws\` | WS | Notifications temps réel + présence |

- **Stockage pluggable** : mémoire (tests) ou fichier JSON (self-hosted), \`flush\` au shutdown.
- **Docker compose** : service \`sync\` sur le port 4848, volume persisté.
- **\`npm run serve:sync\`** lance le serveur standalone.

### Le moteur client — \`src/lib/sync/\`

Le \`SyncEngine\` est **framework-free** (il prend la \`Store\` brute), testé en Node avec 2 appareils simulés :

\`\`\`
1. pull  → applique les changements distants (LWW : jamais écraser un write local plus récent)
2. push  → diff du snapshot local vs ce qu'on a déjà poussé (put / delete)
3. tombstones → les suppressions locales ne peuvent pas être ressuscitées par le pull
4. conflits → le serveur renvoie sa copie gagnante, on l'applique → convergence
\`\`\`

\`\`\`typescript
// Résolution de conflits : last-write-wins + fingerprint comme bris d'égalité
export function lwwShouldApply(incoming: Versioned, current: Versioned | undefined): boolean {
  if (!current) return true;
  if (incoming.version !== current.version) return incoming.version > current.version;
  return incoming.hash !== current.hash; // version égale → hash stable comme tie-break
}
\`\`\`

Le \`fingerprint\` utilise un \`stableStringify\` (tri des clés) pour qu'un même objet ait toujours le même hash. Le **WebSocket temps réel** (backoff exponentiel 1s → 30s) déclenche un \`syncNow()\` dès qu'un autre appareil a poussé.

## ⚡ P3-D — Performance : une note de 200 blocs reste fluide

### Historique diff-based — \`structuredClone\` éliminé du push

Avant, chaque \`push()\` clonait la note entière. Maintenant : **stockage par référence** (push O(1)), clone uniquement à la lecture d'un undo/redo.

| Opération (note 200 blocs) | Avant | Après | Gain |
|---|---|---|---|
| \`push\` ×50 | 19,45 ms | **1,56 ms** | **12,4×** |
| undo ×49 + redo ×49 | — | 26,18 ms | clone à la lecture seulement |

### Rendu incrémental de l'éditeur

- Fenêtre initiale de **60 blocs**, croissance par **40** quand un sentinel (\`IntersectionObserver\`, rootMargin 800px) approche du viewport.
- Rendu complet forcé uniquement pendant les états transitoires : **find & replace**, drag de bloc.
- Le bloc en \`pendingFocus\` est toujours inclus (Enter → le nouveau bloc monte immédiatement).
- \`BlockRow\` (memo) : callbacks stables paramétrés par id → une frappe ne re-rend plus les 200 lignes.
- Find lazy : le scan du document n'a lieu que barre ouverte.

## 🚀 Upload — les 20 minutes d'attente éliminées

Le plan « 20 min d'attente au 1er appel Ollama » est implémenté dans le code :

- **\`keep_alive: "5m"\`** dans \`buildOptions()\` → le modèle reste en RAM entre les appels.
- **\`warmUp()\`** : pré-charge le modèle (\`keep_alive: "24h"\`, prompt vide) au démarrage de l'app, non-bloquant.
- **Parallélisation MAP** : \`MAP_CONCURRENCY = 2\` workers (\`Promise.allSettled\`) au lieu d'une boucle séquentielle, avec résilience (un chunk échoué ≠ tout échoué).
- **\`ProgressEvent\`** (\`onProgress\`) : phases \`loading_model\` → \`generating\` → \`done\`, avec **timer ETA** (\`computeETA\`) dans le \`DashboardJobOverlay\` (temps écoulé + estimation + warning après 60s).

## 🔄 P2-A — Multi-Device Sync (Self-Hosted, Pure Node Server)

The biggest piece: a **zero-dependency self-hosted sync server** synchronizing **11 collections** (notes, folders, flashcards, quiz, attempts, podcasts, chat, databases, db_rows, workspaces, comments) across all devices.

### The Server — \`server/sync.mjs\` + \`server/sync/\`

\`\`\`
[Electron App] ──→ /api/sync/* (mounted on the local server)
                    ├── register / login    → JWT HMAC-SHA256 (node:crypto)
                    ├── pull?since=…        → changes since the cursor
                    ├── push {changes}      → local diffs, LWW server-side
                    ├── share / shares      → note_shares registry (P2-B)
                    └── /api/sync/ws        → minimal WebSocket RFC6455 (realtime)
\`\`\`

| Endpoint | Method | Usage |
|----------|--------|-------|
| \`/api/sync/register\` | POST | Account creation (scrypt + JWT) |
| \`/api/sync/login\` | POST | Login |
| \`/api/sync/pull\` | GET | Changes since a cursor (\`since\`) |
| \`/api/sync/push\` | POST | Push local changes |
| \`/api/sync/share\` | POST/DELETE/PATCH | Share / revoke / change role |
| \`/api/sync/shares\` | GET | Shares of a note |
| \`/api/sync/shared-notes\` | GET | Notes shared with me |
| \`/api/sync/ws\` | WS | Realtime notifications + presence |

- **Pluggable storage**: memory (tests) or JSON file (self-hosted), \`flush\` on shutdown.
- **Docker compose**: \`sync\` service on port 4848 with a persisted volume.
- **\`npm run serve:sync\`** runs the standalone server.

### The Client Engine — \`src/lib/sync/\`

The \`SyncEngine\` is **framework-free** (it takes the raw \`Store\`), tested in Node with 2 simulated devices:

\`\`\`
1. pull  → apply remote changes (LWW: never overwrite a newer local write)
2. push  → diff current local snapshot vs what we pushed (put / delete)
3. tombstones → local deletions can't be resurrected by a pull
4. conflicts → server returns its winning copy, we apply it → convergence
\`\`\`

\`\`\`typescript
// Conflict resolution: last-write-wins + fingerprint as tie-breaker
export function lwwShouldApply(incoming: Versioned, current: Versioned | undefined): boolean {
  if (!current) return true;
  if (incoming.version !== current.version) return incoming.version > current.version;
  return incoming.hash !== current.hash; // equal version → stable hash breaks the tie
}
\`\`\`

The \`fingerprint\` uses a \`stableStringify\` (sorted keys) so the same object always hashes the same. The **realtime WebSocket** (exponential backoff 1s → 30s) triggers \`syncNow()\` as soon as another device pushes.

## ⚡ P3-D — Performance: 200-Block Notes Stay Fluid

### Diff-based History — \`structuredClone\` Eliminated from Push

Before, every \`push()\` cloned the entire note. Now: **reference storage** (push O(1)), clone only on undo/redo read.

| Operation (200-block note) | Before | After | Gain |
|---|---|---|---|
| \`push\` ×50 | 19.45 ms | **1.56 ms** | **12.4×** |
| undo ×49 + redo ×49 | — | 26.18 ms | clone on read only |

### Incremental Editor Rendering

- Initial window of **60 blocks**, growing by **40** when a sentinel (\`IntersectionObserver\`, rootMargin 800px) approaches the viewport.
- Full render forced only during transient states: **find & replace**, block drag.
- The \`pendingFocus\` block is always included (Enter → new block mounts immediately).
- \`BlockRow\` (memo): stable callbacks parameterized by id → one keystroke no longer re-renders all 200 rows.
- Lazy find: document scan only happens when the bar is open.

## 🚀 Upload — 20-Minute Wait Eliminated

The "20 min wait on first Ollama call" plan is implemented:

- **\`keep_alive: "5m"\`** in \`buildOptions()\` → model stays in RAM between calls.
- **\`warmUp()\`**: pre-loads the model (\`keep_alive: "24h"\`, empty prompt) at app startup, non-blocking.
- **MAP parallelization**: \`MAP_CONCURRENCY = 2\` workers (\`Promise.allSettled\`) instead of sequential loop, with resilience (one chunk failing ≠ everything failing).
- **\`ProgressEvent\`** (\`onProgress\`): phases \`loading_model\` → \`generating\` → \`done\`, with **ETA timer** (\`computeETA\`) in the \`DashboardJobOverlay\` (elapsed time + estimate + warning after 60s).

### The View Switcher

The database block now has a **view switcher** (Grid / Board / Calendar / Gallery) that only changes the *view* — filters and sorts stay per-view:

### Board / Kanban — Cross-Column Drag

The Board groups rows by \`select\`/\`multi_select\` field value, with **drag & drop between columns** via \`@dnd-kit\`:

- Auto-generated columns from options + a "No option" column
- **Enriched cards**: colored select pill, checkbox, formatted number (thousands separators), date (month + day), and up to **4 field previews**
- **In-column sorting** via vertical drag (persisted \`sortOrder\`)

### Calendar — Monthly Grid

Month-by-month grid with a **"+" per-day button** to create a dated row, previous/next month navigation, and status-colored pills.

### Gallery — Responsive Tiles

Responsive tiles (2–6 columns based on width) with gradient headers, select-colored pills, and a **+ New row** button at the bottom.

### Inline Cell Editing

Click a cell → **\`CellEditor\` popover** (via \`createPortal\`): text input, number input, checkbox toggle, select dropdown, date picker. Saves on blur/Enter, \`Escape\` cancels. \`RowHistory\` (\`src/components/database/RowHistory.ts\`) tracks a row's edit history.

## 👥 Collaboration Becomes Visible

### ShareModal — Share in 2 Clicks

Share modal with **focus trap**: email field + role selector (Editor / Viewer), collaborator list with role changes and revocation.

\`\`\`tsx

}\`}>
  {entry.accessLevel === "editor" ? "Editor" : "Viewer"}

\`\`\`

### RemoteCursors — Colored Carets Moving Live

Every collaborator sees the **others' carets** in the editor, with their deterministic color (userId hash) and name in a tooltip. Reporting happens via \`selectionchange\` + rAF-throttle, without touching the edit stream.

In the \`EditorToolbar\`, a live indicator shows **"X people viewing this note"**, and a **"View only" badge** appears for viewers — editor, title, emoji and cover all switch to read-only.

### Comment Pins — \`CommentPins\`

\`💬 n\` badge pinned to the right edge of every commented block:

- Measured like cursors: \`data-block-id\` + \`getBoundingClientRect\` re-measured on scroll/resize (rAF-throttled)
- **Accent color** if the thread has unresolved comments, gray otherwise
- Click → the Comments panel opens on that thread
- Accessibility: pins are **focusable buttons** (no \`aria-hidden\` on the container)

\`\`\`tsx

    backgroundColor: pin.unresolved ? "var(--color-accent)" : "var(--color-card)",

### CommentsPanel — The Discussion Thread

Resizable side panel (260–560px): threads sorted by block then date, collapsible replies, **\`@name\` mentions** with keyboard picker (↑↓ / Enter), resolve ✓, deletion by author/owner. On mobile it becomes a **fullscreen sheet**. The composer is hidden for viewers.

### NotificationBell — The Bell That Counts

Bell icon in the sidebar with a **red unread badge** (9+ beyond 9):

- \`role="menu"\` dropdown: sorted notifications, "Mark all as read", "Clear"
- Click a notification → navigates to the note + marks it read
- Types with icons and French relative time (\`relTimeFr\`)

## 📋 The Dashboard Reinvents Itself

### 3 Alternative Views of the Note List

On top of the list, the Dashboard can display notes as:

- **Board (kanban)**: folder columns, drag between columns to move (or pin!), compact cards with source badge
- **Calendar**: dated notes laid out on a monthly grid
- **Gallery**: large tiles with gradient covers

### Quick Color & Tag Filters — \`DashboardFilterBar\`

A chip row: filter by **note color** (pill + name) or by **tag** (\`#tag\`). Click the active chip to remove the filter.

### Redesigned NoteCard

The note card shows: emoji/colored source icon, source badge, title, excerpt, tags, **note color pill** (\`NoteColorPicker\`), relative dates, and the **unresolved-comment counter badge**.

### TemplatesModal — Create From a Template

Lists notes flagged as templates (\`template\`), one-click creation with a \`creating\` state (spinner) on the chosen template.

### PagePropertiesPanel — Metadata Finally Visible

Resizable right panel with: icon + **EmojiPicker**, **cover** (10 gradients), **tags** (add/remove), status (pinned / template), dates (created / modified / last opened), source, and the **Publish** section (slug, password, expiry, copy link, unpublish).

The **Export** menu in the EditorToolbar completes the story: **Markdown**, **Word** (HTML), **HTML** and **PDF printing** (\`printPdf\` — browser dialog).

The music widget has 3 modes (**docked / compact / full**) driven by \`WidgetModeContext\`:

// STATE
// ═══════════════════════════════════════════════════════════════════════
let currentLang = "fr";
let currentArticleId = null;

// ═══════════════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════════════
function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelectorAll("#themeToggle .toggle-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.theme === theme);
  });
}

// ═══════════════════════════════════════════════════════════════════════
// LANGUAGE
// ═══════════════════════════════════════════════════════════════════════
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll("#langToggle .toggle-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  buildNav();
  // Select first article of current language
  const first = articles.find(a => a.lang === lang);
  if (first) selectArticle(first.id);
}

// ═══════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════
function buildNav() {
  const nav = document.getElementById("sidebarNav");
  const filtered = articles.filter(a => a.lang === currentLang);
  const versions = ["V1", "V1.1", "V1.2"];

  let html = "";
  for (const v of versions) {
    const items = filtered.filter(a => a.version === v);
    if (items.length === 0) continue;
    html += `<div class="nav-group"><div class="nav-group-title">${v}</div>`;
    for (const item of items) {
      html += `
        <div class="nav-item ${currentArticleId === item.id ? 'active' : ''}"
             data-id="${item.id}" onclick="selectArticle('${item.id}')">
          <span class="nav-item-icon">${item.icon}</span>
          <span>${item.title}</span>
          <span class="nav-item-tag">${item.category}</span>
        </div>`;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════
// ARTICLE SELECTION
// ═══════════════════════════════════════════════════════════════════════
function selectArticle(id) {
  currentArticleId = id;
  const article = articles.find(a => a.id === id);
  if (!article) return;

  // Update nav active state
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });

  // Render content
  const area = document.getElementById("contentArea");
  const renderedMd = renderMarkdown(article.content);

  area.innerHTML = `
    <div class="content-header">
      <h1>${article.icon} ${article.title}</h1>
      <div class="content-meta">
        <span>📦 Version ${article.version}</span>
        <span>🏷️ ${article.category}</span>
        <span>${currentLang === 'fr' ? '🇫🇷 Français' : '🇬🇧 English'}</span>
      </div>
    </div>
    <div class="md-content">${renderedMd}</div>
    <a href="index.html" class="back-link">← Retour au portfolio</a>
  `;

  // Scroll to top
  document.querySelector('.main').scrollTop = 0;
  window.scrollTo(0, 0);

  // Close mobile sidebar
  document.querySelector('.sidebar').classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════════════
// SIMPLE MARKDOWN RENDERER
// ═══════════════════════════════════════════════════════════════════════
function renderMarkdown(md) {
  let html = md;

  // Code blocks (must be first to prevent inner processing)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `<pre><code class="lang-${lang}">${escaped}</code></pre>`;
  });

  // Inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Tables
  html = html.replace(/^\|(.+)\|$/gm, (match, content) => {
    const cells = content.split('|').map(c => c.trim());
    if (cells.every(c => /^[\s-:]+$/.test(c))) return '<!--table-sep-->';
    const isHeader = false; // We detect header by the separator
    return `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
  });
  html = html.replace(/<tr>(.+?)<\/tr>\n<!--table-sep-->\n<tr>([\s\S]*?)<\/tr>/g, (_, header, body) => {
    const headerCells = header.replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>');
    return `<table><thead><tr>${headerCells}</tr></thead><tbody>${body.replace(/<\/?tr>/g, '')}</tbody></table>`;
  });
  // Simple table fallback
  html = html.replace(/<!--table-sep-->/g, '');

  // Lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (match) => `<ul>${match}</ul>`);

  // Numbered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Paragraphs (lines not starting with <)
  html = html.replace(/^(?!<[a-z/])((?!^\s*$).+)$/gm, '<p>$1</p>');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  // Line breaks
  html = html.replace(/\n\n+/g, '\n');

  return html;
}

// ═══════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════
buildNav();
// Select first article by default
const first = articles.find(a => a.lang === currentLang);
if (first) selectArticle(first.id);
</script>
